<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Talentsoft</title>
<link rel="stylesheet" href="login.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<video autoplay loop muted playsinline id="video-fondo">
    <source src="teclado.mp4" type="video/mp4">
</video>

<header class="main-header">
    <div class="logo">
        <img src="logo.png" alt="Talentsoft">
    </div>
</header>

<section>
    <div class="login-box">
        <form id="formLogin" novalidate>
            <h2>Iniciar sesión</h2>
            <p class="login-subtitle">Ingresa con tu cuenta de Talentsoft</p>

            <div class="input-box">
                <span class="icon"><i class='bx bx-envelope'></i></span>
                <input type="email" id="loginEmail" autocomplete="email" required>
                <label>Correo</label>
            </div>

            <div class="input-box">
                <span class="icon toggle-password" id="togglePassword">
                    <i class='bx bx-lock-alt'></i>
                </span>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
                <label>Contraseña</label>
            </div>

            <p class="login-error" id="loginError" role="alert"></p>

            <div class="remember-forgot">
                <label><input type="checkbox" id="loginRemember"> Recuérdame</label>
                <a href="#" id="linkOlvide">¿Olvidaste la contraseña?</a>
            </div>

            <button type="submit" id="btnLogin">
                <span class="btn-text">Iniciar sesión</span>
                <i class='bx bx-loader-alt btn-spinner'></i>
            </button>

            <p class="demo-hint">
                Cuenta demo: <strong>admin@talentsoft.com</strong> / <strong>Talentsoft2026</strong>
            </p>

            <div class="register-link">
                <p>¿No tienes cuenta? <a href="#">Solicítala a tu administrador</a></p>
            </div>
        </form>
    </div>
</section>

<footer class="login-footer">
    <p>&copy; <span id="footerYear"></span> Talentsoft · Sistema de Gestión de Talento Humano</p>
    <div class="login-footer-links">
        <a href="#">Términos de uso</a>
        <span aria-hidden="true">·</span>
        <a href="#">Privacidad</a>
        <span aria-hidden="true">·</span>
        <a href="#">Soporte</a>
    </div>
</footer>

<script src="login.js"></script>
</body>
</html>
